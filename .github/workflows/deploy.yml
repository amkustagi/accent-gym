name: Test and deploy

on:
  push:
    # main → the live site; qa → a separate Cloudflare preview link (friends beta, tinyhustlers/hq#400).
    branches: [main, qa]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SB_REF: ${{ secrets.SUPABASE_SPEAKCO_REF }}
      REPORT_GH: ${{ secrets.REPORT_GITHUB_TOKEN }}
      AI_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # In-app reports: deploy the `report` function once the Supabase secrets exist (see SETUP.md).
      - name: Deploy the report function
        if: ${{ github.ref_name == 'main' && env.SUPABASE_ACCESS_TOKEN != '' && env.SB_REF != '' && env.REPORT_GH != '' }}
        run: |
          npx --yes supabase@2 secrets set --project-ref "$SB_REF" GITHUB_TOKEN="$REPORT_GH" ${AI_KEY:+ANTHROPIC_API_KEY="$AI_KEY"}
          npx --yes supabase@2 functions deploy report --project-ref "$SB_REF" --no-verify-jwt --use-api
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PRICE_MONTHLY_LABEL: ${{ secrets.VITE_PRICE_MONTHLY_LABEL }}
          VITE_PRICE_LIFETIME_LABEL: ${{ secrets.VITE_PRICE_LIFETIME_LABEL }}
          VITE_REPORT_URL: ${{ secrets.VITE_REPORT_URL || (secrets.SUPABASE_SPEAKCO_REF && secrets.REPORT_GITHUB_TOKEN && format('https://{0}.supabase.co/functions/v1/report', secrets.SUPABASE_SPEAKCO_REF)) || '' }}
      # Friends beta (tinyhustlers/hq#400): Cloudflare Pages project "speakco". main is the live link
      # (speakco.pages.dev), qa a preview (qa.speakco.pages.dev). Skipped until the two secrets exist.
      - name: Publish to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npx --yes wrangler@4 pages project create speakco --production-branch main || true
          npx --yes wrangler@4 pages deploy dist --project-name speakco --branch "$GITHUB_REF_NAME" --commit-dirty=true
      # GitHub Pages stays the live link until the Cloudflare one works (then it can be retired).
      - name: Publish dist to the gh-pages branch
        if: ${{ github.ref_name == 'main' }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
