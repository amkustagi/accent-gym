# Tiny Hustlers merge gate. Every PR must pass this before it is merged (make "Merge gate" a required
# check in branch protection for dev, qa and main). Source: tinyhustlers/hq standards/merge-gate/.
# The checks themselves live in .github/merge-gate/merge_gate.py and the repo's .github/merge-gate.json.
name: Merge gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check versions, release, branches, README, secrets and personal data
        env:
          # Passed through env, never interpolated into the script (PR titles are untrusted input).
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 .github/merge-gate/merge_gate.py --base "origin/$BASE_REF"
          else
            python3 .github/merge-gate/merge_gate.py --all
          fi
