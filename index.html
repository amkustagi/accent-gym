<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone app shell — one scrolling screen per tab, fixed bottom tab bar, big mic as the hero control */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#12302E; --muted:#56706D; --line:#D5DFDD;
  --accent:#E3A008; --accent-ink:#3A2800; --teal:#1F6F68; --teal-soft:#DCEDEA;
  --good:#1E8A4C; --good-soft:#DDF2E5; --bad:#C2412D; --bad-soft:#FBE3DE; --warn-soft:#FCEFC8;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A19; --surface:#152523; --ink:#E4EFEC; --muted:#93AAA6; --line:#26403C;
  --accent:#F2B632; --accent-ink:#2A1C00; --teal:#5FC2B6; --teal-soft:#1B3532;
  --good:#5BD08C; --good-soft:#163525; --bad:#F2876F; --bad-soft:#3A1F1A; --warn-soft:#3A3013; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A19; --surface:#152523; --ink:#E4EFEC; --muted:#93AAA6; --line:#26403C;
  --accent:#F2B632; --accent-ink:#2A1C00; --teal:#5FC2B6; --teal-soft:#1B3532;
  --good:#5BD08C; --good-soft:#163525; --bad:#F2876F; --bad-soft:#3A1F1A; --warn-soft:#3A3013; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:620px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.8rem;font-weight:800}
h2{font-size:1.3rem;font-weight:800}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{background:var(--teal);color:#fff;border:0}
.hero .lbl{color:rgba(255,255,255,.75)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
button{font:700 .95rem var(--body);border-radius:12px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.ghost{background:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.hero .stat{background:rgba(255,255,255,.12)}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.75rem;opacity:.8}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan li{display:flex;gap:10px;align-items:center}
.check{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.6);flex:0 0 auto;display:grid;place-items:center;font-size:.8rem}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plan button{margin-left:auto;padding:6px 12px;font-size:.85rem;background:rgba(255,255,255,.15);color:#fff;border:0}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px}
.bars div{flex:1;background:var(--teal);border-radius:6px 6px 2px 2px;min-height:4px;position:relative}
.bars div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
/* mic */
.micwrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.mic{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;position:relative}
.mic svg{width:38px;height:38px;fill:currentColor}
.mic.live{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.mic.live::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--bad);animation:ring 1.2s ease-out infinite}@keyframes ring{from{opacity:.8;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}}
.clock{font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums}
.transcript{background:var(--bg);border-radius:12px;padding:12px;min-height:72px;font-size:1.05rem;line-height:1.7;overflow-wrap:anywhere}
.transcript:empty::before{content:attr(data-empty);color:var(--muted)}
mark{border-radius:5px;padding:0 3px;color:inherit}
mark.f{background:var(--warn-soft);text-decoration:underline wavy var(--accent)}
mark.w{background:var(--bad-soft);text-decoration:underline var(--bad)}
.score{font-family:var(--display);font-size:3.4rem;font-weight:800;line-height:1}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{border-left:4px solid var(--bad);background:var(--bad-soft);border-radius:4px 10px 10px 4px;padding:8px 12px;font-size:.95rem}
.tip.f{border-color:var(--accent);background:var(--warn-soft)}
.tip.ok{border-color:var(--good);background:var(--good-soft)}
.tip b{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:7px 13px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.frame{font-family:var(--mono);font-size:.82rem;color:var(--teal)}
/* swap quiz */
.weak{font-family:var(--display);font-size:1.35rem;font-weight:600;color:var(--bad);text-decoration:line-through 2px;text-decoration-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;font-weight:400;font-size:1rem;line-height:1.4}
.opts button.right{background:var(--good-soft);border-color:var(--good);font-weight:700}
.opts button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.big{font-family:var(--display);font-size:1.4rem;font-weight:600;line-height:1.35}
.big .hit{color:var(--good)}
.big .miss{color:var(--bad);text-decoration:underline}
.reader{font-size:1.3rem;line-height:1.9;font-family:var(--display)}
.reader span{transition:color .1s;color:var(--muted)}
.reader span.done{color:var(--ink)}
.reader span.now{color:var(--accent-ink);background:var(--accent);border-radius:4px}
.reader .pz{color:var(--teal);font-family:var(--mono)}
input[type=range]{width:100%;accent-color:var(--teal)}
textarea{width:100%;min-height:110px;font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px}
.toast{background:var(--bad-soft);border-radius:12px;padding:10px 12px;font-size:.92rem}
.toast.info{background:var(--teal-soft)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs div{display:flex;max-width:620px;width:100%}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--teal)}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>

<script>
/* ---------- content ---------- */
const PROMPTS=[
 {t:'Give a status update on your project',frame:'Where it stands → What is next → What you need',secs:60},
 {t:'Push back on an unrealistic deadline',frame:'Acknowledge → Constraint → Your proposal',secs:45},
 {t:'Introduce yourself to a new team',frame:'Name & role → What you own → How to reach you',secs:30},
 {t:'Your manager asks: "Why is this late?"',frame:'Fact → Cause → Recovery plan with a date',secs:45},
 {t:'Disagree with a colleague\'s idea',frame:'Credit the goal → Your concern → Alternative',secs:45},
 {t:'Ask for more people or budget',frame:'The goal → The gap → The specific ask',secs:45},
 {t:'Say no to an extra task',frame:'Current priorities → Trade-off → Offer',secs:30},
 {t:'Explain a technical issue to a non-technical person',frame:'What broke → Impact → What happens next',secs:60},
 {t:'Close the meeting with next steps',frame:'Decision → Owners → Dates',secs:30},
 {t:'Answer: "What do you think we should do?"',frame:'Recommendation → Two reasons → Risk',secs:45}
];
const WEAK=[
 {re:/\b(?:i'?m |i am )?(?:so |very )?sorry\b/gi,k:'sorry',fix:'Thank instead of apologizing: "Thanks for waiting" beats "Sorry for the delay."'},
 {re:/\bapologi[sz]e\b/gi,k:'apologize',fix:'Save apologies for real mistakes.'},
 {re:/\bjust\b/gi,k:'just',fix:'Cut it. "I just wanted to check" → "I\'m checking on…"'},
 {re:/\bi think\b/gi,k:'I think',fix:'State it: "I recommend…" or "The data shows…"'},
 {re:/\bi feel like\b/gi,k:'I feel like',fix:'"My view is…" or simply say the point.'},
 {re:/\b(?:kind|sort) of\b/gi,k:'kind of',fix:'Drop the softener.'},
 {re:/\bmaybe\b/gi,k:'maybe',fix:'"Maybe we could…" → "Let\'s…"'},
 {re:/\bi guess\b/gi,k:'I guess',fix:'Commit to the statement or give your reason.'},
 {re:/\bhopefully\b/gi,k:'hopefully',fix:'"We will…" and name the real risk.'},
 {re:/\bi'?ll try\b|\bi will try\b/gi,k:'I\'ll try',fix:'"I will…" plus a date.'},
 {re:/\bi'?m not (?:an )?expert\b|\bi could be wrong\b|\bi'?m not sure\b/gi,k:'self-doubt',fix:'"My best read is…" Lead with the point.'},
 {re:/\bdoes (?:that|this) make sense\b/gi,k:'make sense?',fix:'"What questions do you have?"'},
 {re:/\bif that'?s (?:ok|okay|alright|fine)\b/gi,k:'if that\'s okay',fix:'Ask directly; you don\'t need permission.'},
 {re:/\bkindly\b/gi,k:'kindly',fix:'"Could you…" sounds natural in North American offices.'},
 {re:/\bdo the needful\b/gi,k:'do the needful',fix:'Name the action: "Could you approve it by Friday?"'},
 {re:/\brevert(?: back)?\b/gi,k:'revert',fix:'Here "revert" means undo. Say "reply" or "get back to me."'},
 {re:/\bprepone\b/gi,k:'prepone',fix:'"Move it earlier" or "move it up."'},
 {re:/\bno problem\b/gi,k:'no problem',fix:'"Happy to" or "Glad to."'},
 {re:/\bplease\b/gi,k:'please',fix:'One "please" is polite. Repeated, it sounds like pleading.',allow:1}
];
const FILL=[
 {re:/\b(?:um+|uh+|uhm|erm|hmm)\b/gi,k:'um/uh'},
 {re:/\blike\b/gi,k:'like'},
 {re:/\byou know\b/gi,k:'you know'},
 {re:/\bbasically\b/gi,k:'basically'},
 {re:/\bactually\b/gi,k:'actually'},
 {re:/\bliterally\b/gi,k:'literally'},
 {re:/\bi mean\b/gi,k:'I mean'},
 {re:/\bso yeah\b/gi,k:'so yeah'}
];
const SWAPS=[
 {w:"Sorry to bother you, but do you have a minute?",s:"Do you have a minute?",a:["Sorry, sorry, quick question?","I'm sorry if this is a bad time, but…"],y:"Asking a question is not an offense. Drop the apology."},
 {w:"Sorry for the late reply.",s:"Thanks for your patience.",a:["Sorry sorry, I was very busy.","So sorry, apologies for the delay."],y:"Thank people for what they gave you."},
 {w:"I just wanted to check if you saw my email.",s:"Following up on my email from Tuesday.",a:["I just wanted to quickly check, if that's okay.","Sorry, did you maybe get a chance to see it?"],y:"\"Just\" shrinks your request."},
 {w:"I think maybe we should push the release?",s:"I recommend we move the release to Friday.",a:["I feel like maybe pushing it could kind of help.","Maybe we push it? Not sure."],y:"Recommend, and name the date."},
 {w:"Please do the needful.",s:"Could you approve the invoice by Thursday?",a:["Kindly do the needful at the earliest.","Please do it, please."],y:"Name the exact action and the deadline."},
 {w:"Kindly revert back at the earliest.",s:"Could you reply by end of day?",a:["Please revert back ASAP.","Kindly revert back soon."],y:"In North America \"revert\" means undo. Say \"reply.\""},
 {w:"Can we prepone the meeting?",s:"Can we move the meeting earlier, to 2 pm?",a:["Can we prepone it to before?","Can we do it early-early?"],y:"\"Prepone\" is unfamiliar outside India."},
 {w:"Does that make sense?",s:"What questions do you have?",a:["Is it making sense or not?","Sorry, was that confusing?"],y:"Invite questions without doubting yourself."},
 {w:"I'll try to get it done by Friday.",s:"I'll have it done by Friday.",a:["I'll try my best, hopefully Friday.","Maybe Friday, I'll try."],y:"Commit. If there's a risk, name it."},
 {w:"I'm not an expert, but I feel like the numbers are off.",s:"The numbers look off: Q3 revenue doesn't match the forecast.",a:["I could be wrong, but maybe the numbers are kind of off?","Sorry, I'm no expert, but…"],y:"Lead with the point and the evidence."},
 {w:"No problem!",s:"Happy to help.",a:["No issues, no issues.","Not a problem at all, sorry."],y:"Positive framing beats a double negative."},
 {w:"Sorry, can I just add something?",s:"I'd like to add one point.",a:["Sorry sorry, just one small thing?","If that's okay, can I maybe add?"],y:"Claim the floor. You don't need permission to speak."},
 {w:"Um, so, basically, the server, like, crashed.",s:"The server crashed at 2 pm. We're restoring it now.",a:["So basically the server crashed, you know.","Actually, the server, basically, crashed."],y:"Swap fillers for a pause. Fact first, then action."},
 {w:"Is it? Okay, okay.",s:"Got it. Thanks.",a:["Is it? Really? Okay okay.","Ohh, is it?"],y:"Confirm once, cleanly."},
 {w:"Hopefully we'll hit the target.",s:"We're on track to hit the target. The risk is vendor delays.",a:["Hopefully, fingers crossed.","We'll try, hopefully."],y:"Show confidence and name the real risk."},
 {w:"Sorry, I didn't understand.",s:"Could you say that another way?",a:["Sorry sorry, what?","Sorry, I'm confused, sorry."],y:"Ask for what you need instead of apologizing."}
];
const TWISTERS=[
 {t:'Red leather, yellow leather',lv:1},{t:'Toy boat, toy boat, toy boat',lv:1},{t:'Truly rural, truly rural',lv:1},
 {t:'She sells seashells by the seashore',lv:2},{t:'Unique New York, unique New York, you know you need unique New York',lv:2},
 {t:'Peter Piper picked a peck of pickled peppers',lv:2},{t:'Six sticky skeletons, six sticky skeletons',lv:3},
 {t:'The sixth sick sheik\'s sixth sheep\'s sick',lv:3},{t:'Fresh French fried fish, fresh French fried fish',lv:3},
 {t:'Which wristwatches are Swiss wristwatches',lv:3}
];
const PASSAGES=[
 {t:'Project update',x:'Here is where we stand. / The integration is ninety percent complete. / We finish testing on Thursday, / and we launch on Monday. / The one risk is the vendor API. / I need a decision on the backup plan by Wednesday.'},
 {t:'Pushing back',x:'I understand why Friday matters. / With the current team, / Friday means we skip testing. / I recommend we ship the core features Friday / and the reports the following week. / That keeps quality where it needs to be.'},
 {t:'Introduction',x:'Hi everyone, I\'m Avinash. / I lead the data platform work. / My focus this quarter is cutting report time in half. / If you need anything from the platform, / message me directly. / I\'m glad to be on this team.'},
 {t:'Bad news',x:'The release is delayed by three days. / We found a security issue in final testing. / The fix is done, / and we are retesting now. / The new date is Thursday. / I will send an update tomorrow at noon.'}
];

/* ---------- state ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=store.get('ss-state',{xp:0,days:{},history:[],best:{}});
const save=()=>store.set('ss-state',S);
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>dkey(Date.now());
function bump(kind,xp){const d=S.days[today()]=S.days[today()]||{};d[kind]=(d[kind]||0)+1;S.xp+=xp||0;save()}
function streak(){let n=0,t=Date.now();const has=k=>S.days[k]&&Object.keys(S.days[k]).length;if(!has(dkey(t)))t-=864e5;while(has(dkey(t))){n++;t-=864e5}return n}
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=s=>s.toLowerCase().replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean);
const $=s=>document.querySelector(s);

/* ---------- speech in/out ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(onText,onEnd){
  let final='',stopped=false,ended=false,rec;const gen=navGen;
  const finish=err=>{if(ended)return;ended=true;if(gen===navGen)onEnd(final.trim(),err)};
  const start=()=>{rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;
    rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)final+=r[0].transcript+' ';else interim+=r[0].transcript}onText((final+' '+interim).replace(/\s+/g,' ').trim())};
    rec.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){stopped=true;finish(e.error)}};
    rec.onend=()=>{if(stopped)finish();else{try{start()}catch(_){finish()}}};
    try{rec.start()}catch(_){stopped=true;finish('not-allowed')}};
  start();
  return {stop(){stopped=true;try{rec.stop()}catch(_){finish()}}};
}
const MICERR={'not-allowed':'Microphone is blocked. Allow it for this site in your browser settings, or type your answer below.','service-not-allowed':'Speech recognition is turned off. On iPhone: Settings › Siri & Search › enable Siri/Dictation. Or type your answer below.','audio-capture':'No microphone found.'};
const synth=window.speechSynthesis;
function say(text){if(!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(text);const v=synth.getVoices().find(v=>/^en[-_]US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Ava/i.test(v.name))||synth.getVoices().find(v=>/^en[-_]US/i.test(v.lang));if(v)u.voice=v;u.lang='en-US';synth.speak(u)}
if(synth)synth.getVoices();

/* ---------- analysis ---------- */
function analyze(text,secs){
  const n=words(text).length,found=[];
  WEAK.forEach(w=>{const m=text.match(w.re)||[];const c=Math.max(0,m.length-(w.allow||0));if(c)found.push({type:'w',k:w.k,c,fix:w.fix})});
  FILL.forEach(f=>{const c=(text.match(f.re)||[]).length;if(c)found.push({type:'f',k:f.k,c})});
  const weak=found.filter(x=>x.type==='w').reduce((a,x)=>a+x.c,0),fill=found.filter(x=>x.type==='f').reduce((a,x)=>a+x.c,0);
  const wpm=secs>3?Math.round(n/(secs/60)):0;
  let score=100-weak*7-fill*4;
  if(wpm&&wpm<110)score-=Math.round((110-wpm)/4);
  if(wpm>175)score-=Math.round((wpm-175)/3);
  if(n<15)score-=20;
  return {n,wpm,weak,fill,found,score:Math.max(0,Math.min(100,score))};
}
function highlight(text){
  let h=esc(text);
  WEAK.forEach(w=>{h=h.replace(new RegExp(w.re.source,'gi'),m=>'<mark class="w">'+m+'</mark>')});
  FILL.forEach(f=>{h=h.replace(new RegExp(f.re.source,'gi'),m=>'<mark class="f">'+m+'</mark>')});
  return h;
}
function lcsMatch(target,got){
  const a=words(target),b=words(got),dp=Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=new Array(a.length).fill(false);let i=a.length,j=b.length;
  while(i&&j){if(a[i-1]===b[j-1]){hit[i-1]=true;i--;j--}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--}
  return {acc:a.length?Math.round(100*dp[a.length][b.length]/a.length):0,hit,tw:target.split(/\s+/)};
}

/* ---------- shell ---------- */
const ICONS={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',speak:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',swap:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',clarity:'<path d="M4 12h3l3-7 4 14 3-7h3"/>',pace:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>'};
const TABS=[['home','Today'],['speak','Speak'],['swap','Swaps'],['clarity','Clarity'],['pace','Pace']];
let tab='home',session=null,navGen=0;
function nav(t){navGen++;if(session){session.stop();session=null}if(paceTimer){clearTimeout(paceTimer);paceTimer=null}if(synth)synth.cancel();tab=t;renderTabs();VIEWS[t]();window.scrollTo(0,0)}
function renderTabs(){$('#tabs').innerHTML=TABS.map(([k,l])=>'<button data-t="'+k+'"'+(k===tab?' aria-current="page"':'')+'><svg viewBox="0 0 24 24">'+ICONS[k]+'</svg>'+l+'</button>').join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>nav(b.dataset.t))}
const MIC='<svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm7-4h-2a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>';
const STOP='<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

/* ---------- Today ---------- */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(tab==='home')VIEWS.home()});
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function home(){
  const d=S.days[today()]||{},lvl=Math.floor(S.xp/100)+1;
  const plan=[['clarity','Clarity warm-up',1,d.clarity||0],['swap','Swap 5 weak phrases',5,d.swap||0],['speak','One Speak round',1,d.speak||0]];
  const hist=S.history.slice(-7);
  const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  let h='<header class="row spread"><div><h1>Speak Sharp</h1><p class="muted">Sound clear and confident in meetings.</p></div></header>';
  h+='<section class="card hero"><p class="lbl">Today</p><div class="stats"><div class="stat"><b>'+streak()+'</b><span>day streak</span></div><div class="stat"><b>'+lvl+'</b><span>level</span></div><div class="stat"><b>'+S.xp+'</b><span>XP</span></div></div><ul class="plan">'+
    plan.map(([t,l,goal,n])=>'<li><span class="check'+(n>=goal?' on':'')+'">'+(n>=goal?'✓':'')+'</span><span>'+l+(goal>1?' <span style="opacity:.7">('+Math.min(n,goal)+'/'+goal+')</span>':'')+'</span><button data-go="'+t+'">'+(n>=goal?'Again':'Go')+'</button></li>').join('')+'</ul></section>';
  h+='<section class="card"><p class="lbl">Last Speak scores</p>'+(hist.length?'<div class="bars" style="margin-top:18px">'+hist.map(x=>'<div style="height:'+Math.max(6,x.score)+'%" title="'+esc(x.p)+'"><span>'+x.score+'</span></div>').join('')+'</div><p class="muted" style="font-size:.88rem">Latest: '+hist[hist.length-1].fill+' fillers, '+hist[hist.length-1].weak+' weak phrases, '+hist[hist.length-1].wpm+' words/min.</p>':'<p class="muted">No rounds yet. Do one Speak round and your score shows up here.</p>')+'</section>';
  if(!standalone()){h+='<section class="card"><p class="lbl">Install on your phone</p>'+(deferredInstall?'<p>Add Speak Sharp to your home screen. It opens full-screen and works offline.</p><button class="primary" id="inst">Install app</button>':iOS?'<p>In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>.</p>':'<p>In Chrome, tap <b>⋮</b>, then <b>Install app</b> or <b>Add to Home screen</b>.</p>')+'</section>'}
  h+='<section class="card"><p class="lbl">Rule of the day</p><p class="big" style="font-size:1.15rem">'+esc(SWAPS[Math.floor(Date.now()/864e5)%SWAPS.length].y)+'</p></section>';
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));
  const ib=$('#inst');if(ib)ib.onclick=async()=>{deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;home()};
}

/* ---------- Speak ---------- */
let pIdx=Math.floor(Date.now()/864e5)%PROMPTS.length;
function speak(){
  const p=PROMPTS[pIdx];
  let h='<header><h1>Speak</h1><p class="muted">Answer out loud. The app flags fillers and weak phrases as you talk.</p></header>';
  h+='<div class="chips">'+PROMPTS.map((x,i)=>'<button class="chip" data-p="'+i+'" aria-pressed="'+(i===pIdx)+'">'+(i+1)+'</button>').join('')+'</div>';
  h+='<section class="card"><p class="lbl">Scenario · '+p.secs+' seconds</p><h2>'+esc(p.t)+'</h2><p class="frame">'+esc(p.frame)+'</p></section>';
  h+='<section class="card"><div class="micwrap"><button class="mic" id="mic" aria-label="Start speaking">'+MIC+'</button><div class="clock" id="clock">0:'+String(p.secs).padStart(2,'0')+'</div><p class="muted" id="micnote">'+(SR?'Tap the mic and start talking':'Live listening isn\'t supported in this browser. Type below, or use your keyboard\'s dictation mic.')+'</p></div>';
  h+='<div class="transcript" id="tx" data-empty="Your words appear here…"></div>';
  h+='<div id="manual"'+(SR?' hidden':'')+'><textarea id="ta" placeholder="Type or dictate your answer…"></textarea><button class="dark" id="anl" style="margin-top:8px">Score my answer</button></div></section>';
  h+='<div id="result"></div>';
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pIdx=+b.dataset.p;speak()});
  const mic=$('#mic'),tx=$('#tx'),clock=$('#clock');
  let t0=0,tick=null,last='';
  const end=(text,err)=>{clearInterval(tick);mic.classList.remove('live');mic.innerHTML=MIC;session=null;
    if(err){$('#micnote').innerHTML='<span class="toast" style="display:block">'+MICERR[err]+'</span>';$('#manual').hidden=false;return}
    const secs=Math.max(1,(Date.now()-t0)/1000);result(text||last,secs,p)};
  mic.onclick=()=>{
    if(!SR){$('#ta').focus();return}
    if(session){session.stop();return}
    $('#result').innerHTML='';tx.innerHTML='';last='';t0=Date.now();
    mic.classList.add('live');mic.innerHTML=STOP;mic.setAttribute('aria-label','Stop');$('#micnote').textContent='Listening… tap to stop';
    tick=setInterval(()=>{const left=Math.max(0,p.secs-Math.floor((Date.now()-t0)/1000));clock.textContent='0:'+String(left).padStart(2,'0');if(left<=0&&session)session.stop()},250);
    session=listen(t=>{last=t;tx.innerHTML=highlight(t)},end);
  };
  $('#anl').onclick=()=>{const v=$('#ta').value.trim();if(!v)return;tx.innerHTML=highlight(v);const est=words(v).length/140*60;result(v,est,p,true)};
}
function result(text,secs,p,typed){
  const r=analyze(text,secs);const el=$('#result');
  if(!r.n){el.innerHTML='<p class="toast">I didn\'t catch any words. Check the mic and try again.</p>';return}
  const xp=10+Math.round(r.score/10);
  S.history.push({t:Date.now(),p:p.t,score:r.score,wpm:r.wpm,fill:r.fill,weak:r.weak});if(S.history.length>60)S.history.shift();bump('speak',xp);
  const pace=typed?'':r.wpm<110?'A bit slow. Aim for 130–160 words per minute.':r.wpm>175?'Too fast. Slow down and pause between ideas.':'Good pace.';
  const verdict=r.score>=90?'Sharp. That sounded confident.':r.score>=70?'Solid. Clean up the flagged words and you\'re there.':'Lots of softeners. Try again and pause instead of filling.';
  let h='<section class="card"><div class="row spread"><div><p class="lbl">Score</p><div class="score" style="color:'+(r.score>=85?'var(--good)':r.score>=65?'var(--teal)':'var(--bad)')+'">'+r.score+'</div></div><p style="flex:1;min-width:160px">'+verdict+' <span class="muted">+'+xp+' XP</span></p></div>';
  h+='<div class="stats"><div class="stat"><b>'+r.fill+'</b><span>fillers</span></div><div class="stat"><b>'+r.weak+'</b><span>weak phrases</span></div><div class="stat"><b>'+(typed?'—':r.wpm)+'</b><span>words/min</span></div></div><div class="tips">';
  r.found.filter(x=>x.type==='w').forEach(x=>h+='<div class="tip"><b>"'+esc(x.k)+'" ×'+x.c+'</b>'+esc(x.fix)+'</div>');
  const fl=r.found.filter(x=>x.type==='f');if(fl.length)h+='<div class="tip f"><b>Fillers: '+fl.map(x=>esc(x.k)+' ×'+x.c).join(', ')+'</b>Close your mouth and pause for one beat instead. Silence sounds confident.</div>';
  if(pace)h+='<div class="tip '+(pace==='Good pace.'?'ok':'f')+'"><b>Pace</b>'+pace+'</div>';
  if(!r.found.length)h+='<div class="tip ok"><b>No weak words</b>Nothing to cut. Now work on structure: '+esc(p.frame)+'.</div>';
  h+='</div><p class="muted" style="font-size:.82rem">Speech recognition sometimes drops "um" and "uh", so your real filler count may be higher.</p><button class="primary" id="again">Try again</button></section>';
  el.innerHTML=h;$('#again').onclick=speak;el.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- Swaps ---------- */
let deck=[],di=0,right=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function swap(){if(!deck.length||di>=deck.length){deck=shuffle(SWAPS).slice(0,8);di=0;right=0}swapCard()}
function swapCard(){
  if(di>=deck.length){$('#app').innerHTML='<header><h1>Swaps</h1></header><section class="card"><p class="lbl">Round complete</p><div class="score">'+right+'/'+deck.length+'</div><p>'+(right===deck.length?'Perfect round.':'Replay the round to lock these in.')+'</p><button class="primary" id="nr">New round</button></section>';$('#nr').onclick=()=>{deck=[];swap()};return}
  const c=deck[di],opts=shuffle([c.s,...c.a]);
  let h='<header><h1>Swaps</h1><p class="muted">Pick the stronger way to say it, then say it out loud.</p></header>';
  h+='<div class="progress"><i style="width:'+(di/deck.length*100)+'%"></i></div>';
  h+='<section class="card"><p class="lbl">Instead of</p><p class="weak">'+esc(c.w)+'</p><p class="lbl">Say</p><div class="opts">'+opts.map(o=>'<button data-o="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div><div id="after"></div></section>';
  $('#app').innerHTML=h;
  let answered=false;
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    if(answered)return;answered=true;const ok=b.dataset.o===c.s;
    document.querySelectorAll('[data-o]').forEach(x=>{if(x.dataset.o===c.s)x.classList.add('right');else if(x===b)x.classList.add('wrong')});
    if(ok){right++;bump('swap',10)}else bump('swap',2);
    let a='<div class="tip '+(ok?'ok':'')+'"><b>'+(ok?'Right.':'Not quite.')+'</b>'+esc(c.y)+'</div>';
    a+='<div class="row"><button class="ghost" id="hear">▶ Hear it</button>'+(SR?'<button class="dark" id="sayit">🎙 Say it</button>':'')+'<button class="primary" id="next" style="margin-left:auto">Next</button></div><div id="sayres"></div>';
    $('#after').innerHTML=a;
    $('#hear').onclick=()=>say(c.s);
    $('#next').onclick=()=>{di++;swapCard()};
    const sb=$('#sayit');if(sb)sb.onclick=()=>{
      if(session){session.stop();return}
      sb.textContent='■ Stop';$('#sayres').innerHTML='<p class="muted">Listening…</p>';
      session=listen(t=>{$('#sayres').innerHTML='<p class="muted">'+esc(t)+'</p>'},(t,err)=>{session=null;sb.textContent='🎙 Say it again';
        if(err){$('#sayres').innerHTML='<p class="toast">'+MICERR[err]+'</p>';return}
        const m=lcsMatch(c.s,t),weakLeft=analyze(t,0).weak;
        $('#sayres').innerHTML='<p class="big" style="font-size:1.1rem">'+m.tw.map((w,i)=>'<span class="'+(m.hit[i]?'hit':'miss')+'">'+esc(w)+'</span>').join(' ')+'</p><p class="muted">'+m.acc+'% match'+(weakLeft?' · you slipped in a weak word':'')+'</p>';
        if(m.acc>=85)bump('swap',5)});
      setTimeout(()=>{if(session)session.stop()},7000);
    };
  });
}

/* ---------- Clarity ---------- */
let tIdx=0;
function clarity(){
  const tw=TWISTERS[tIdx],best=S.best[tIdx];
  let h='<header><h1>Clarity</h1><p class="muted">Crisp consonants and an open jaw. Say it clean first, then fast.</p></header>';
  h+='<div class="chips">'+TWISTERS.map((x,i)=>'<button class="chip" data-tw="'+i+'" aria-pressed="'+(i===tIdx)+'">'+'●'.repeat(x.lv)+' '+(i+1)+(S.best[i]&&S.best[i].acc>=90?' ✓':'')+'</button>').join('')+'</div>';
  h+='<section class="card"><p class="lbl">Level '+tw.lv+(best?' · best '+best.acc+'% at '+best.wps+' words/sec':'')+'</p><p class="big" id="target">'+esc(tw.t)+'</p><div class="row"><button class="ghost" id="hear">▶ Hear it</button></div>';
  h+='<div class="micwrap"><button class="mic" id="mic" aria-label="Start">'+MIC+'</button><p class="muted" id="cn">'+(SR?'Tap, say it once clearly, tap again':'Live listening isn\'t supported in this browser. Practice with Hear it.')+'</p></div><div id="cres"></div></section>';
  h+='<section class="card"><p class="lbl">How to practice</p><p>1. Say it slowly with exaggerated mouth movement until you hit 90%.<br>2. Then go faster without dropping below 90%.<br>3. Move up a level when it feels easy.</p></section>';
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-tw]').forEach(b=>b.onclick=()=>{tIdx=+b.dataset.tw;clarity()});
  $('#hear').onclick=()=>say(tw.t);
  const mic=$('#mic');let t0=0;
  mic.onclick=()=>{
    if(!SR)return;if(session){session.stop();return}
    t0=Date.now();mic.classList.add('live');mic.innerHTML=STOP;$('#cn').textContent='Listening… tap when done';$('#cres').innerHTML='';
    session=listen(t=>{$('#cres').innerHTML='<p class="muted">'+esc(t)+'</p>'},(t,err)=>{session=null;mic.classList.remove('live');mic.innerHTML=MIC;$('#cn').textContent='Tap to try again';
      if(err){$('#cres').innerHTML='<p class="toast">'+MICERR[err]+'</p>';return}
      const secs=Math.max(.5,(Date.now()-t0)/1000-0.6),m=lcsMatch(tw.t,t),wps=Math.round(words(tw.t).length/secs*10)/10;
      $('#target').innerHTML=m.tw.map((w,i)=>'<span class="'+(m.hit[i]?'hit':'miss')+'">'+esc(w)+'</span>').join(' ');
      const nb=!best||m.acc>best.acc||(m.acc>=best.acc&&wps>best.wps);if(nb&&m.acc>0){S.best[tIdx]={acc:m.acc,wps};save()}
      bump('clarity',m.acc>=90?10:4);
      $('#cres').innerHTML='<div class="stats"><div class="stat"><b>'+m.acc+'%</b><span>clarity</span></div><div class="stat"><b>'+wps+'</b><span>words/sec</span></div><div class="stat"><b>'+(nb?'New':'—')+'</b><span>best</span></div></div><div class="tip '+(m.acc>=90?'ok':'f')+'"><b>'+(m.acc>=90?'Clean. Now go faster.':'Slow down and hit every consonant.')+'</b>Red words weren\'t recognized. Exaggerate those.</div>'});
  };
}

/* ---------- Pace ---------- */
let psIdx=0,wpm=140,paceTimer=null;
function pace(){
  const ps=PASSAGES[psIdx];
  const toks=ps.x.split(/\s+/);
  let h='<header><h1>Pace</h1><p class="muted">Read along with the highlight. Stop fully at every /. That pause is where you breathe and let the point land.</p></header>';
  h+='<div class="chips">'+PASSAGES.map((x,i)=>'<button class="chip" data-ps="'+i+'" aria-pressed="'+(i===psIdx)+'">'+esc(x.t)+'</button>').join('')+'</div>';
  h+='<section class="card"><div class="row spread"><p class="lbl">Speed</p><span class="frame" id="wv">'+wpm+' words/min</span></div><input type="range" id="wpm" min="100" max="180" step="5" value="'+wpm+'" aria-label="Words per minute">';
  h+='<p class="reader" id="rd">'+toks.map((w,i)=>w==='/'?'<span class="pz" data-i="'+i+'">/</span>':'<span data-i="'+i+'">'+esc(w)+'</span>').join(' ')+'</p>';
  h+='<div class="row"><button class="primary" id="go">Start reading</button><button class="ghost" id="hear">▶ Hear model</button></div></section>';
  h+='<section class="card"><p class="lbl">Why it works</p><p>Most people speed up when nervous. 130–150 words per minute with clear pauses sounds calm and senior. Start at 130, then move toward 150.</p></section>';
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{psIdx=+b.dataset.ps;if(paceTimer)clearTimeout(paceTimer);paceTimer=null;pace()});
  $('#wpm').oninput=e=>{wpm=+e.target.value;$('#wv').textContent=wpm+' words/min'};
  $('#hear').onclick=()=>say(ps.x.replace(/\s\/\s?/g,'. ').replace(/\.\./g,'.'));
  const spans=[...document.querySelectorAll('#rd span')];
  $('#go').onclick=()=>{
    if(paceTimer){clearTimeout(paceTimer);paceTimer=null;$('#go').textContent='Start reading';return}
    spans.forEach(s=>s.className=s.classList.contains('pz')?'pz':'');let i=0;$('#go').textContent='Stop';
    const step=()=>{if(i>0)spans[i-1].classList.replace('now','done')||spans[i-1].classList.add('done');
      if(i>=spans.length){paceTimer=null;$('#go').textContent='Read again';bump('pace',8);return}
      const s=spans[i];s.classList.add('now');const isP=s.classList.contains('pz');i++;
      paceTimer=setTimeout(step,isP?700:60000/wpm)};
    step();
  };
}

const VIEWS={home,speak,swap,clarity,pace};
renderTabs();home();
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
